name: Build Android APK

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Saudi-Memory-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saudi-Memory-AI-Android
          path: Saudi-Memory-AI.apk
          if-no-files-found: error
          retention-days: 30
